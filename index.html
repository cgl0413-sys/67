<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸運雙骰・終極大對決</title>
<style>
:root{color-scheme:dark;--bg:#101426;--panel:#1c2540;--gold:#ffd166;--cyan:#7ee7e1;--muted:#aeb9d4}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px 16px;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#f7f8ff;background:radial-gradient(circle at 15% 10%,#303d68 0,transparent 32%),radial-gradient(circle at 90% 90%,#442d63 0,transparent 30%),var(--bg);display:flex;justify-content:center;align-items:center}
main{width:min(760px,100%)}
header{text-align:center;margin-bottom:22px}
header .eyebrow{color:var(--cyan);letter-spacing:3px;font-size:.82rem;font-weight:700}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0;color:var(--gold);text-shadow:0 4px 24px #ffd16640}
.subtitle{color:var(--muted);margin:0}
.panel{background:#1c2540eF;border:1px solid #ffffff20;border-radius:22px;padding:24px;box-shadow:0 18px 55px #0006;margin:14px 0}
.setup{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:7px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #ffffff30;background:#10182d;color:white;font:inherit;outline:none}
input:focus{border-color:var(--cyan)}
button{border:0;border-radius:13px;padding:13px 20px;font:inherit;font-weight:800;cursor:pointer;transition:.15s}
button:hover{transform:translateY(-2px);filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.primary{background:linear-gradient(135deg,#ffd166,#ffad5c);color:#252033}
.secondary{background:#354263;color:white}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.status{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.score{display:flex;gap:12px}
.score div{background:#10182d;padding:10px 16px;border-radius:12px;text-align:center;min-width:105px}
.score strong{display:block;font-size:1.7rem;color:var(--gold)}
.round{color:var(--cyan);font-weight:700}
.battle{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.side{background:#10182d;border-radius:16px;padding:18px;text-align:center}
.side h2{font-size:1.05rem;margin:0 0 14px}
.dice{display:flex;justify-content:center;gap:10px;min-height:76px;align-items:center}
.die{width:62px;height:62px;background:#fff;color:#222;border-radius:14px;display:grid;place-items:center;font-size:2.4rem;box-shadow:0 5px 0 #c6c6c6}
.total{font-size:1rem;color:var(--muted);margin:12px 0 0}
.total b{font-size:1.5rem;color:white;margin-left:5px}
.leopard{color:var(--gold);font-weight:800;min-height:24px;margin-top:6px}
.message{text-align:center;min-height:52px;padding:14px;color:var(--cyan);font-weight:700}
.rules{color:var(--muted);font-size:.92rem;line-height:1.7}
.rules b{color:var(--gold)}
.hidden{display:none}
footer{text-align:center;color:#8792af;font-size:.8rem;margin-top:16px}
@media(max-width:560px){.setup{grid-template-columns:1fr}.panel{padding:18px}.die{width:54px;height:54px}.score div{min-width:90px;padding:8px 11px}}
</style>
</head>
<body>
<main>
<header>
 <div class="eyebrow">LUCKY DICE CHALLENGE</div>
 <h1>🎲 幸運雙骰 終極大對決 🎲</h1>
 <p class="subtitle">擲出你的好運，率先拿下 3 勝！</p>
</header>
<section class="panel" id="setupPanel">
 <h2>✨ 冒險者角色設定</h2>
 <div class="setup">
  <div><label for="playerName">你的冒險者名字</label><input id="playerName" maxlength="20" placeholder="輸入你的名字"></div>
  <div><label for="equipment">你的使用裝備</label><input id="equipment" maxlength="30" placeholder="例如：黃金鍵盤、魔法魔杖"></div>
 </div>
 <div class="actions"><button class="primary" id="startBtn">開始挑戰</button></div>
</section>
<section class="panel hidden" id="gamePanel">
 <div class="status">
  <div><div class="round" id="roundLabel">第 1 回合</div><div id="welcome"></div></div>
  <div class="score">
   <div>你 <strong id="playerScore">0</strong> 勝</div>
   <div>電腦 <strong id="computerScore">0</strong> 勝</div>
  </div>
 </div>
 <div class="battle">
  <div class="side">
   <h2>🧙 <span id="playerTitle">冒險者</span></h2>
   <div class="dice"><div class="die" id="pDie1">?</div><div class="die" id="pDie2">?</div></div>
   <p class="total">總點數 <b id="pTotal">—</b></p><div class="leopard" id="pLeopard"></div>
  </div>
  <div class="side">
   <h2>🤖 電腦</h2>
   <div class="dice"><div class="die" id="cDie1">?</div><div class="die" id="cDie2">?</div></div>
   <p class="total">總點數 <b id="cTotal">—</b></p><div class="leopard" id="cLeopard"></div>
  </div>
 </div>
 <div class="message" id="message">準備好了嗎？按下擲骰開始！</div>
 <div class="actions" style="justify-content:center">
  <button class="primary" id="rollBtn">🎲 擲出雙骰</button>
  <button class="secondary" id="restartBtn">重新開始</button>
 </div>
</section>
<section class="panel rules">
 <b>📜 遊戲規則</b><br>
 • 雙方各擲兩顆骰子，比較兩顆骰子的總點數。<br>
 • <b>率先獲得 3 勝</b>的一方就是最終贏家。<br>
 • 特殊規則：<b>豹子</b>（兩顆骰子點數相同）可以直接通殺一般點數；若雙方都是豹子，則比較總點數。<br>
 • 若總點數相同，該回合平手，雙方都不加分。
</section>
<footer>祝你骰運亨通！</footer>
</main>
<script>
const $ = id => document.getElementById(id);
let playerWins=0, computerWins=0, round=1, playerName="冒險者", equipment="";
const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];
function startGame(){
 playerName=$("playerName").value.trim()||"無名冒險者";
 equipment=$("equipment").value.trim()||"神秘裝備";
 $("playerTitle").textContent=playerName;
 $("welcome").textContent=`歡迎勇敢的 ${playerName}！已裝備【${equipment}】，迎接挑戰！`;
 playerWins=0;computerWins=0;round=1;
 $("setupPanel").classList.add("hidden");$("gamePanel").classList.remove("hidden");
 $("rollBtn").disabled=false;
 resetDice();updateScore();
 $("message").textContent="冒險者，按下「擲出雙骰」開始第一回合！";
}
function resetDice(){
 ["pDie1","pDie2","cDie1","cDie2"].forEach(id=>$(id).textContent="?"); 
 $("pTotal").textContent=$("cTotal").textContent="—";
 $("pLeopard").textContent=$("cLeopard").textContent="";
}
function updateScore(){
 $("playerScore").textContent=playerWins;$("computerScore").textContent=computerWins;
 $("roundLabel").textContent=`第 ${round} 回合`;
}
function roll(){
 if(playerWins>=3||computerWins>=3)return;
 const p1=1+Math.floor(Math.random()*6),p2=1+Math.floor(Math.random()*6);
 const c1=1+Math.floor(Math.random()*6),c2=1+Math.floor(Math.random()*6);
 const pt=p1+p2,ct=c1+c2,pl=p1===p2,cl=c1===c2;
 $("pDie1").textContent=faces[p1-1];$("pDie2").textContent=faces[p2-1];
 $("cDie1").textContent=faces[c1-1];$("cDie2").textContent=faces[c2-1];
 $("pTotal").textContent=pt;$("cTotal").textContent=ct;
 $("pLeopard").textContent=pl?"🔥 豹子！":"";
 $("cLeopard").textContent=cl?"🔥 豹子！":"";
 let result;
 if(pl&&!cl){playerWins++;result="🎉 哇！你擲出了豹子，直接通殺贏得這回合！";}
 else if(cl&&!pl){computerWins++;result="💥 慘了！電腦擲出了豹子，直接通殺贏得這回合！";}
 else if(pt>ct){playerWins++;result="🎉 你的總點數比較大，這回合你贏了！";}
 else if(pt<ct){computerWins++;result="💥 電腦的總點數比較大，這回合電腦贏了！";}
 else result="🤝 總點數一模一樣，平手！沒有人得分。";
 if(playerWins===3||computerWins===3){
  result+=playerWins===3?` 🏆 恭喜 ${playerName} 以 ${playerWins}：${computerWins} 擊敗電腦，成為賭神級的冒險者！`:` 💻 很可惜，電腦以 ${computerWins}：${playerWins} 獲得最終勝利，下次再來挑戰吧！`;
  $("rollBtn").disabled=true;
  $("rollBtn").textContent="本局已結束";
 }else{round++;}
 updateScore();$("message").textContent=result;
}
function restart(){ $("gamePanel").classList.add("hidden");$("setupPanel").classList.remove("hidden");$("rollBtn").textContent="🎲 擲出雙骰"; }
$("startBtn").addEventListener("click",startGame);
$("rollBtn").addEventListener("click",roll);
$("restartBtn").addEventListener("click",restart);
$("playerName").addEventListener("keydown",e=>{if(e.key==="Enter")startGame()});
</script>
</body>
</html>
